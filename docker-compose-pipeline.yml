services:
  maven:
    image: maven:3.9-eclipse-temurin
    container_name: maven_build
    working_dir: /workspace
    volumes:
      - .:/workspace
    tty: true
    command: >
      sh -c "
      ls -la &&
      ls -la /workspace &&
      mvn clean install &&
      mvn test &&
      mvn jacoco:report &&
      mvn checkstyle:check
      "
