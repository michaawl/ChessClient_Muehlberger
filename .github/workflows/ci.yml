on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  checks: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: sudo apt-get update && sudo apt-get install -y docker-compose

      - name: Build and Test in Docker
        run: docker-compose -f docker-compose-pipeline.yml up --abort-on-container-exit

      - name: Extract JaCoCo Report
        run: cp target/site/jacoco/index.html jacoco-report.html

      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: jacoco-report.html

      - name: Extract Checkstyle Report
        run: cp target/checkstyle-checker.xml checkstyle-report.xml || true

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: checkstyle-report.xml

      - name: Extract Test Results
        run: cp target/surefire-reports/*.xml test-results/ || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/*.xml

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/test-results/*.xml'
          require_tests: true
          fail_on_failed_tests: false
          include_passed: true

      - name: Extract Maven Artifact
        run: cp target/*.jar maven-artifact.jar || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maven-artifact
          path: maven-artifact.jar
